<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Solicitar Serviço - Assistência Inclusiva</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Assistência Inclusiva</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="mural.html">Mural</a>
      <a href="login.html">Sair</a>
    </nav>
  </header>

  <div class="container-cadastro">
    <h2>Solicitar Assistência</h2>
    <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 14px;">
      Preencha os campos abaixo para publicar um novo pedido no mural.
    </p>

    <form id="formServico">
      
      <label for="titulo">Título do Serviço</label>
      <input type="text" id="titulo" placeholder="Ex: Preciso de ajuda com compras" required>

      <label for="descricao">Descrição Detalhada</label>
      <input type="text" id="descricao" placeholder="Descreva brevemente o que precisa..." required>

      <label for="cidadeServico">Cidade</label>
      <input type="text" id="cidadeServico" placeholder="Ex: Rio de Janeiro - RJ" required>

      <label for="contato">Contato (Telefone/E-mail)</label>
      <input type="text" id="contato" placeholder="Ex: (21) 99999-9999" required>

      <button type="submit">Publicar no Mural</button>
    </form>
  </div>

  <script src="index.js"></script>
</body>
</html>
